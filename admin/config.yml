backend:
  name: git-gateway
  branch: main

# This lets editors upload photos for blog posts through the dashboard.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Category"
        name: "tag"
        widget: "select"
        options: ["gold", "silver", "platinum", "coins", "watches", "general"]
      - { label: "Short Summary (shown on the blog list)", name: "excerpt", widget: "text" }
      - { label: "Post Photo", name: "image", widget: "image", required: false }
      - { label: "Post Body", name: "body", widget: "markdown" }
